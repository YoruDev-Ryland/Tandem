name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io names must be lowercase; the owner may not be.
      - id: image
        run: echo "name=ghcr.io/${OWNER,,}/tandem" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Tandem
            org.opencontainers.image.description=Self-hosted save and config sync for emulators on Android handhelds
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write signing config
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A release must be signed with the release key: devices only accept updates signed with the key they
          # were installed with, so an unsigned or debug-signed APK would be useless (and the updater rejects it).
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are required."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=$PWD/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build signed APK
        working-directory: android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 gives name 1.2.3 and code 1002003 (minor and patch get three digits each).
          name="${TAG#v}"
          core="${name%%[-+]*}"
          major=$(echo "$core" | cut -d. -f1)
          minor=$(echo "$core" | cut -d. -f2 -s)
          patch=$(echo "$core" | cut -d. -f3 -s)
          export TANDEM_VERSION_NAME="$name"
          export TANDEM_VERSION_CODE=$(( major * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          ./gradlew assembleRelease
      - name: Check the signature and name the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed release APK was built (app-release.apk is missing)."; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner verify --print-certs "$apk"
          cp "$apk" tandem.apk
          # The app's updater downloads tandem.apk and checks it against this file before installing.
          sha256sum tandem.apk | cut -d' ' -f1 > tandem.apk.sha256
          rm -f android/release.keystore android/keystore.properties
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tandem.apk
            tandem.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
